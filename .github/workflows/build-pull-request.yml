# ============================================================
# build-pull-request.yml
#
# Triggers: Any pull request opened or updated against any branch.
#
# Purpose: Verify that the PR compiles and produces valid jars.
#   This is a pure safety check - no side effects.
#
# Trust level: UNTRUSTED. PR code may come from a fork or an
#   unreviewed contributor. Two consequences:
#     1. cache-read-only: true - PRs can read the warm cache from
#        build-commit, but cannot write back to it.
#        This prevents a malicious or broken PR from poisoning
#        the cache that main branch builds depend on.
#     2. No secrets are available to pull_request triggers from
#        forks (GitHub enforces this automatically).
#
# Versioning: Jars use the Gradle release version with the PR number and
# short commit SHA in build metadata. e.g.
# 1.4.0+cobblemon-1.7.3.pr42.a3f92c1.
# This identifies exactly which PR and commit produced a jar without
# modifying the branch's version configuration.
# ============================================================

name: build-pull-request

on: [ pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build
        run: ./gradlew build -Pbuild_metadata="pr${{ github.event.pull_request.number }}.${GITHUB_SHA::7}"

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: Chiselmon-fabric-${{ github.sha }}
          path: |
            fabric/build/libs/Chiselmon-fabric-*.jar
            !fabric/build/libs/Chiselmon-fabric-*-sources.jar
            !fabric/build/libs/Chiselmon-fabric-*-dev.jar
            !fabric/build/libs/Chiselmon-fabric-*-shadow.jar
            !fabric/build/libs/Chiselmon-fabric-*-javadoc.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: Chiselmon-neoforge-${{ github.sha }}
          path: |
            neoforge/build/libs/Chiselmon-neoforge-*.jar
            !neoforge/build/libs/Chiselmon-neoforge-*-sources.jar
            !neoforge/build/libs/Chiselmon-neoforge-*-dev.jar
            !neoforge/build/libs/Chiselmon-neoforge-*-shadow.jar
            !neoforge/build/libs/Chiselmon-neoforge-*-javadoc.jar
          if-no-files-found: error