# ============================================================
# build-pull-request.yml
#
# Triggers: Any pull request opened or updated against any branch.
#
# Purpose: Verify that the PR compiles and produces valid jars.
#   This is a pure safety check - no side effects.
#
# Trust level: UNTRUSTED. PR code may come from a fork or an
#   unreviewed contributor. Two consequences:
#     1. cache-read-only: true - PRs can read the warm cache from
#        build-commit, but cannot write back to it.
#        This prevents a malicious or broken PR from poisoning
#        the cache that main branch builds depend on.
#     2. No secrets are available to pull_request triggers from
#        forks (GitHub enforces this automatically).
#
# Versioning: Jars are stamped with the base version from
#   gradle.properties + the PR number + short commit SHA.
#   e.g. 1.1.0-alpha+pr42.a3f92c1
#   This lets you identify exactly which PR and commit a jar
#   came from without touching gradle.properties.
# ============================================================

name: build-pull-request

on: [ pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Construct a version suffix from the PR number and short SHA.
      # Output: e.g. "1.1.0-alpha+pr42.a3f92c1"
      # The base version (1.1.0-alpha) comes from gradle.properties;
      # we append build metadata so the file doesn't need manual edits.
      - name: Compute build version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          SHORT_SHA="${GITHUB_SHA::7}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "version=${BASE_VERSION}+pr${PR_NUMBER}.${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build -Pmod_version="${{ steps.version.outputs.version }}"

      # Upload both platform jars as separate artifacts so you can
      # The archivesName in build.gradle is `${mod_id}-${project.name}`,
      # so jars are named chiselmon-fabric-*.jar / chiselmon-neoforge-*.jar.
      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: chiselmon-fabric-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          path: fabric/build/libs/chiselmon-fabric-*.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: chiselmon-neoforge-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          path: neoforge/build/libs/chiselmon-neoforge-*.jar
          if-no-files-found: error