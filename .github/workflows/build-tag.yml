# ============================================================
# build-tag.yml
#
# Triggers: Any pushed tag matching v* (e.g. v1.1.0, v1.2.0-beta).
#
# Purpose: Produce the official release artifact for a version.
#   This is the jar that will go to users.
#
# Trust level: TRUSTED. You cut the tag manually.
#   Tag builds don't write to the cache. A release is defaults:
#   point-in-time snapshot, it should not mutate shared infrastructure.
#
# Versioning: The version is taken DIRECTLY from the tag name,
#   not from gradle.properties. Tag "v1.1.0" -> mod_version
#   "1.1.0". gradle.properties is intentionally ignored here.
#   This is the only workflow that produces a clean version with no SHA suffix.
#
# Environment: Runs under the "prod" GitHub Environment.
# ============================================================

name: build-tag

on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Strip the "v" prefix from the tag to get the clean version.
      # Tag "v1.1.0" -> mod_version "1.1.0"
      - name: Compute release version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build -Pmod_version="${{ steps.version.outputs.version }}"

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: chiselmon-fabric-${{ github.sha }}
          path: |
            fabric/build/libs/chiselmon-fabric-*.jar
            !fabric/build/libs/chiselmon-fabric-*-sources.jar
            !fabric/build/libs/chiselmon-fabric-*-dev.jar
            !fabric/build/libs/chiselmon-fabric-*-shadow.jar
            !fabric/build/libs/chiselmon-fabric-*-javadoc.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: chiselmon-neoforge-${{ github.sha }}
          path: |
            neoforge/build/libs/chiselmon-neoforge-*.jar
            !neoforge/build/libs/chiselmon-neoforge-*-sources.jar
            !neoforge/build/libs/chiselmon-neoforge-*-dev.jar
            !neoforge/build/libs/chiselmon-neoforge-*-shadow.jar
            !neoforge/build/libs/chiselmon-neoforge-*-javadoc.jar
          if-no-files-found: error