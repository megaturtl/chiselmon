# ============================================================
# build-tag.yml
#
# Triggers: Any pushed tag matching v* (e.g. v1.1.0, v1.2.0-beta).
#
# Purpose: Produce the official release artifact for a version.
#   This is the jar that will go to users.
#
# Trust level: TRUSTED. You cut the tag manually.
#   Tag builds don't write to the cache. A release is defaults:
#   point-in-time snapshot, it should not mutate shared infrastructure.
#
# Versioning: The configured Gradle version is the release identity.
# The tag must match it exactly. This is the only workflow that produces
# a clean version with no build metadata.
#
# Environment: Runs under the "prod" GitHub Environment.
# ============================================================

name: build-tag

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - id: version
        name: Verify release version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(nix develop --no-update-lock-file -c ./gradlew --quiet printVersion)"
          test "$tag" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: nix develop --no-update-lock-file -c ./gradlew build

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            fabric/build/libs/Chiselmon-fabric-${{ steps.version.outputs.version }}.jar
            neoforge/build/libs/Chiselmon-neoforge-${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true